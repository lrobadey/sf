<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SF Bay Area Stores</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
    h1 { padding: 14px 20px; background: #fff; font-size: 16px; color: #333; border-bottom: 1px solid #ddd; }
    h1 span { color: #e63946; }
    #map { height: calc(100vh - 48px); width: 100%; }

    .custom-marker {
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .marker-lululemon { background: #e63946; }
    .marker-banana { background: #2a6496; }
    .marker-home { background: #2d9e5f; font-size: 15px; }
    .marker-apt { background: #e8a020; font-size: 15px; }

    .legend {
      position: fixed;
      bottom: 30px;
      left: 12px;
      background: white;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      line-height: 1.9;
    }
    .legend-dot {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .leaflet-popup-content {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-width: 200px;
    }
    .popup-name { font-weight: 700; font-size: 15px; color: #e63946; margin-bottom: 4px; }
    .popup-rating { color: #e63946; font-weight: 600; margin-bottom: 2px; }
    .popup-addr { color: #555; margin-bottom: 2px; }
    .popup-phone { color: #555; }
    .popup-status { color: #555; font-size: 12px; margin-top: 2px; }
    .popup-sponsored { display: inline-block; background: #eee; border-radius: 3px; font-size: 11px; padding: 1px 5px; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>SF Bay Area Stores</h1>
  <div id="map"></div>
  <div class="legend">
    <div><span class="legend-dot" style="background:#e63946"></span>lululemon</div>
    <div><span class="legend-dot" style="background:#2a6496"></span>Banana Republic</div>
    <div><span class="legend-dot" style="background:#2d9e5f"></span>Luca's Place</div>
    <div><span class="legend-dot" style="background:#e8a020"></span>Potential Studio</div>
  </div>

  <script>
    const map = L.map('map').setView([37.82, -122.38], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const stores = [
      {
        num: 1,
        name: "lululemon",
        address: "845 Market Street Unit 225, San Francisco",
        phone: "(415) 546-3985",
        sponsored: true,
        rating: null,
        reviews: null,
        hours: null,
        lat: 37.7843,
        lng: -122.4075
      },
      {
        num: 2,
        name: "lululemon",
        address: "1981 Union St, San Francisco",
        phone: "(415) 915-2913",
        sponsored: false,
        rating: "4/5",
        reviews: 331,
        hours: "Closed · Opens tomorrow 10 AM",
        lat: 37.7981,
        lng: -122.4358
      },
      {
        num: 3,
        name: "lululemon",
        address: "2040 Fillmore St, San Francisco",
        phone: "(415) 991-2621",
        sponsored: false,
        rating: "4/5",
        reviews: 15,
        hours: "Closed · Opens tomorrow 10 AM",
        lat: 37.7913,
        lng: -122.4341
      },
      {
        num: 4,
        name: "lululemon",
        address: "1901 Fourth St Suite 102, Berkeley",
        phone: "(510) 939-9223",
        sponsored: false,
        rating: "3.5/5",
        reviews: 211,
        hours: "Closed · Opens tomorrow 10 AM",
        lat: 37.8697,
        lng: -122.2978
      },
      {
        num: 1,
        brand: "banana",
        name: "Banana Republic",
        address: "152 Geary St, San Francisco",
        phone: "(628) 333-2510",
        sponsored: false,
        rating: "3.5/5",
        reviews: 11,
        hours: "Closed · Opens tomorrow 11 AM",
        lat: 37.7877,
        lng: -122.4065
      },
      {
        num: 3,
        brand: "banana",
        name: "Banana Republic",
        address: "2 Folsom St, San Francisco",
        phone: "(415) 966-2610",
        sponsored: false,
        rating: "2/5",
        reviews: 51,
        hours: "Closed · Opens tomorrow 10 AM",
        lat: 37.7847,
        lng: -122.3952
      }
    ];

    const homeIcon = L.divIcon({
      className: '',
      html: `<div class="custom-marker marker-home">⌂</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -16]
    });
    const aptIcon = L.divIcon({
      className: '',
      html: `<div class="custom-marker marker-apt">★</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -16]
    });
    const apts = [
      { lat: 37.7764, lng: -122.4226, addr: "400 Grove St" },
      { lat: 37.7886, lng: -122.3940, addr: "388 Beale St" },
      { lat: 37.7783, lng: -122.4153, addr: "1190 Mission St" },
    ];
    apts.forEach(apt => {
      L.marker([apt.lat, apt.lng], { icon: aptIcon })
        .addTo(map)
        .bindTooltip(`<b>${apt.addr}</b><br>💰 $2,000/mo`, { direction: 'top', offset: [0, -16] })
        .bindPopup(`<div class="popup-name" style="color:#e8a020">Potential Studio Apt</div><div class="popup-addr">📍 ${apt.addr}, San Francisco</div><div class="popup-status">💰 $2,000/mo</div>`);
    });

    L.marker([37.7727, -122.4296], { icon: homeIcon })
      .addTo(map)
      .bindPopup(`<div class="popup-name" style="color:#2d9e5f">Luca's Place</div><div class="popup-addr">📍 873 Oak St, San Francisco</div>`);

    stores.forEach(store => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="custom-marker ${store.brand === 'banana' ? 'marker-banana' : 'marker-lululemon'}">${store.num}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -16]
      });

      let popupHtml = `<div class="popup-name">${store.name}</div>`;
      if (store.sponsored) popupHtml += `<div><span class="popup-sponsored">Sponsored</span></div>`;
      if (store.rating) popupHtml += `<div class="popup-rating">★ ${store.rating} (${store.reviews})</div>`;
      popupHtml += `<div class="popup-addr">📍 ${store.address}</div>`;
      if (store.hours) popupHtml += `<div class="popup-status">${store.hours}</div>`;
      popupHtml += `<div class="popup-phone">📞 ${store.phone}</div>`;

      L.marker([store.lat, store.lng], { icon })
        .addTo(map)
        .bindPopup(popupHtml);
    });
  </script>
</body>
</html>
